name: Release Mobile

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        id: appver
        working-directory: apps/mobile
        shell: bash
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="$(node -p "require('./app.json').expo.version")"
          fi
          export APP_VERSION
          node scripts/sync-version.mjs
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prebuild Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Detect signing secrets
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Android release signing
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/mobile
        run: node scripts/configure-android-signing.mjs

      - name: Write release keystore
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/mobile/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build release APK and AAB
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect artifacts
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          mkdir -p dist
          if [[ "$SIGNED" == "true" ]]; then
            SUFFIX=""
          else
            SUFFIX="-unsigned"
          fi
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "dist/dqmainer-${{ steps.appver.outputs.version }}${SUFFIX}.apk"
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab \
            "dist/dqmainer-${{ steps.appver.outputs.version }}${SUFFIX}.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS (IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        id: appver
        working-directory: apps/mobile
        shell: bash
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="$(node -p "require('./app.json').expo.version")"
          fi
          export APP_VERSION
          node scripts/sync-version.mjs
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prebuild iOS project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios --clean

      # Produces an unsigned IPA. Installing on a physical device requires
      # re-signing with an Apple Developer certificate, or additional signing
      # secrets wired into this step.
      - name: Build unsigned IPA
        working-directory: apps/mobile/ios
        shell: bash
        run: |
          WORKSPACE="$(ls -d ./*.xcworkspace | head -n1)"
          SCHEME="$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null \
            | sed -n '/Schemes:/,$p' | tail -n +2 | grep -v '^[[:space:]]*$' | head -n1 | tr -d ' ')"
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/dqmainer.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          APP_PATH="$(find "$RUNNER_TEMP/dqmainer.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n1)"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          zip -qry "dqmainer-${{ steps.appver.outputs.version }}.ipa" Payload

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "dqmainer-${{ steps.appver.outputs.version }}.ipa" "$GITHUB_WORKSPACE/dist/"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: dist

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-artifacts
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          files: dist/*
